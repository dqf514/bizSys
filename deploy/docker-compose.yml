name: bizsys

services:
  mysql:
    image: mysql:8.4
    container_name: bizsys-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bizsys123}
      MYSQL_DATABASE: bizsys
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max_connections=500
    ports:
      # 仅本机/网关需要访问数据库时使用；不需要外部访问可改为 "127.0.0.1:${MYSQL_PORT:-3307}:3306"
      - "${MYSQL_BIND:-0.0.0.0}:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: bizsys-redis
    restart: unless-stopped
    ports:
      # 不需要外部访问 Redis 时可改为 "127.0.0.1:${REDIS_PORT:-6379}:6379"
      - "${REDIS_BIND:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: bizsys-api
    restart: unless-stopped
    environment:
      # 后端容器时区（东八区），与 MySQL --default-time-zone 保持一致
      TZ: Asia/Shanghai
      DB_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-bizsys123}@mysql:3306/bizsys?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ENV: prod
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: bizsys-web
    restart: unless-stopped
    ports:
      # 局域网/网关入口（portal.hmvic.cn 反代指向此端口）
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads:
  backups:
