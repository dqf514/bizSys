name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  changelog:
    name: 变更日志门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 功能性改动必须同步 CHANGELOG.md
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE"..HEAD)
          printf '%s\n' "$CHANGED"
          CODE_CHANGED=$(printf '%s\n' "$CHANGED" | grep -E '^(backend/app/|frontend/src/|backend/alembic/)' || true)
          if [ -n "$CODE_CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::检测到功能性改动但未更新 CHANGELOG.md —— 请在文件顶部按 Keep a Changelog 追加版本条目（Added/Changed/Deprecated/Removed/Fixed/Security），并同步 Settings.app_version、frontend/package.json、backend/pyproject.toml 三处版本号。"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: bizsys123
          MYSQL_DATABASE: bizsys
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: mysql+pymysql://root:bizsys123@127.0.0.1:3306/bizsys?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        working-directory: backend
        run: uv sync
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests
      - name: Alembic migrate
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Seed
        working-directory: backend
        run: uv run python -m app.seeds.init_data
      - name: Pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # 版本取自 package.json packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: i18n missing keys check
        run: pnpm i18n:check
      - name: Hardcoded literal scan
        run: pnpm scan:literal
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
