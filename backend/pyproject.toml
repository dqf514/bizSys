[project]
name = "bizsys-backend"
version = "0.1.0"
description = "bizSys 业务系统后端（FastAPI + SQLAlchemy 2 + MySQL + Redis）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "pymysql>=1.1.1",
    "cryptography>=43.0",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<6",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.2,<5",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.5",
    "httpx>=0.28",
    "tenacity>=9.0",
    "email-validator>=2.2",
    "apscheduler>=3.11,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends/Annotated 惯用法

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
