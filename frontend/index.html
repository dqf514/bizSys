<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA / 移动端：可「添加到主屏」，微信/浏览器内打开时沉浸式显示 -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="bizSys" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>bizSys</title>
    <script>
      // anti-FOUC: restore theme/density/accent before first paint
      try {
        var t = localStorage.getItem('bs.theme') || 'light'
        var d = localStorage.getItem('bs.density') || 'comfortable'
        var a = localStorage.getItem('bs.accent') || 'blue'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.setAttribute('data-density', d)
        document.documentElement.setAttribute('data-accent', a)
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {
        /* noop */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
